<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce API Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 2rem;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        button {
            padding: 0.8rem 1.2rem;
            border-radius: 0.8rem;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        button .method {
            font-size: 0.7rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 0.4rem;
            background: var(--primary);
        }

        button.post .method { background: #10b981; }
        button.get .method { background: #3b82f6; }
        button.delete .method { background: #ef4444; }

        .viewer-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        #token-status {
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            display: none;
            align-self: flex-start;
        }

        #response-viewer {
            flex-grow: 1;
            background: #020617;
            border-radius: 1rem;
            padding: 1rem;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.85rem;
            overflow: auto;
            max-height: 600px;
            white-space: pre-wrap;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 0.4rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .status-success { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-error { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        @media (max-width: 768px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>API Test Center</h1>
            <p style="color: #94a3b8">Premium testing environment for your E-Commerce Backend</p>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div class="section-title">📦 API ENDPOINTS</div>
                <div class="btn-group">
                    <p style="font-size: 0.75rem; color: #64748b; margin-top: 1rem;">AUTHENTICATION</p>
                    <button class="post" onclick="test('signup')">Register User <span class="method">POST</span></button>
                    <button class="post" onclick="test('login')">Login User <span class="method">POST</span></button>
                    
                    <p style="font-size: 0.75rem; color: #64748b; margin-top: 1rem;">PRODUCTS</p>
                    <button class="post" onclick="test('addProduct')">Create Product <span class="method">POST</span></button>
                    <button class="get" onclick="test('getProducts')">List Products <span class="method">GET</span></button>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                        <button class="post" onclick="test('editProduct')" style="flex: 1; justify-content: center;">Edit <span class="method" style="margin-left:5px">PUT</span></button>
                        <button class="delete" onclick="test('deleteProduct')" style="flex: 1; justify-content: center;">Delete <span class="method" style="margin-left:5px">DEL</span></button>
                    </div>
                    
                    <p style="font-size: 0.75rem; color: #64748b; margin-top: 1rem;">CART & PAYMENTS</p>
                    <input type="text" id="prod-id-input" placeholder="Product ID (Auto-fills on List)..." style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem; width: 100%;">
                    <button class="post" onclick="test('addToCart')">Add to Cart <span class="method">POST</span></button>
                    <button class="post" onclick="test('checkout')">Create Checkout <span class="method">POST</span></button>
                </div>
            </div>

            <div class="viewer-container">
                <div id="token-status">✓ Access Token Active</div>
                <div class="card" style="flex-grow: 1; min-height: 400px; display: flex; flex-direction: column;">
                    <div class="section-title">📄 RESPONSE VIEW</div>
                    <div id="response-viewer">Select an endpoint to start testing...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        let accessToken = localStorage.getItem('api_token') || '';

        if (accessToken) document.getElementById('token-status').style.display = 'block';

        async function test(type) {
            const viewer = document.getElementById('response-viewer');
            viewer.innerHTML = 'Executing request...';
            
            let url = '';
            let options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            };

            if (accessToken) {
                options.headers['Authorization'] = `Bearer ${accessToken}`;
            }

            try {
                switch(type) {
                    case 'signup':
                        url = '/auth/signup';
                        options.body = JSON.stringify({
                            full_name: "Dashboard Tester",
                            email: `test_${Date.now()}@example.com`,
                            password: "Password123!"
                        });
                        break;
                    case 'login':
                        url = '/auth/login';
                        // Use a consistent email for login tests, or try the last one
                        options.body = JSON.stringify({
                            email: "test@example.com", 
                            password: "Password123!"
                        });
                        break;
                    case 'addProduct':
                        url = '/products';
                        options.body = JSON.stringify({
                            name: "Smart Watch Elite",
                            description: "Premium health and fitness tracker.",
                            price: 299.99,
                            stock_quantity: 50
                        });
                        break;
                    case 'editProduct':
                        const editId = document.getElementById('prod-id-input').value;
                        if (!editId) {
                            alert('Please "List Products" first or paste a Product ID to edit!');
                            return;
                        }
                        url = `/products/${editId}`;
                        options.method = 'PUT';
                        options.body = JSON.stringify({
                            name: "Updated Product Name",
                            description: "Updated description.",
                            price: 350.00,
                            stock_quantity: 10
                        });
                        break;
                    case 'deleteProduct':
                        const delId = document.getElementById('prod-id-input').value;
                        if (!delId) {
                            alert('Please "List Products" first or paste a Product ID to delete!');
                            return;
                        }
                        url = `/products/${delId}`;
                        options.method = 'DELETE';
                        delete options.body;
                        break;
                    case 'getProducts':
                        url = '/products';
                        options.method = 'GET';
                        delete options.body;
                        break;
                    case 'addToCart':
                        url = '/carts/add-product';
                        const prodId = document.getElementById('prod-id-input').value;
                        options.body = JSON.stringify({
                            product_id: prodId || "00000000-0000-0000-0000-000000000000",
                            quantity: 1
                        });
                        break;
                    case 'checkout':
                        url = '/payments/create-checkout-session';
                        delete options.body;
                        break;
                }

                const response = await fetch(API_BASE + url, options);
                const data = await response.json();

                // Auto-fill Product ID if we list or create products
                if (type === 'getProducts' && data.data && data.data.length > 0) {
                    document.getElementById('prod-id-input').value = data.data[0].id;
                } else if (type === 'addProduct' && data.id) {
                    document.getElementById('prod-id-input').value = data.id;
                } else if (type === 'addProduct' && data.product && data.product.id) {
                    document.getElementById('prod-id-input').value = data.product.id;
                }

                // If login, save token
                if (type === 'login' && data.token) {
                    accessToken = data.token;
                    localStorage.setItem('api_token', accessToken);
                    document.getElementById('token-status').style.display = 'block';
                }

                const statusClass = response.ok ? 'status-success' : 'status-error';
                viewer.innerHTML = `<div class="status-badge ${statusClass}">STATUS: ${response.status} ${response.statusText}</div>\n\n` + 
                                 JSON.stringify(data, null, 4);

            } catch (err) {
                viewer.innerHTML = `<div class="status-badge status-error">CONNECTION FAILED</div>\n\n${err.message}\n\nMake sure your server is running at ${API_BASE}`;
            }
        }
    </script>
</body>
</html>
